<!DOCTYPE html>
<html>
<head>
    <title>Weather Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #map { height: 500px; }
        .weather-card { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Weather Map</h1>
        
        <form method="post" class="mb-4">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6">
                    {{ form.city }}
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary">Get Weather</button>
                </div>
            </div>
        </form>

        <div id="map"></div>

        {% if weather_data %}
        <div class="weather-card card">
            <div class="card-body">
                <h2 class="card-title">{{ weather_data.name }}</h2>
                <p class="card-text">
                    Temperature: {{ weather_data.main.temp }}°C<br>
                    Weather: {{ weather_data.weather.0.description }}<br>
                    Humidity: {{ weather_data.main.humidity }}%
                </p>
            </div>
        </div>
        {% endif %}
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map
        var map = L.map('map').setView([51.505, -0.09], 13);

        // Add tile layer (using OpenStreetMap)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Add click event handler
        map.on('click', function(e) {
            // You can add code here to handle map clicks
            console.log("Lat, Lon : " + e.latlng.lat + ", " + e.latlng.lng);
            // Add API call for coordinates if needed
        });
    </script>
</body>
</html>
