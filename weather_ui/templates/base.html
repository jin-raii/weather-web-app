<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{%block title %} Weather App {% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Weather Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    
    {% load static %}
    {% comment %} <link rel="stylesheet" href="{% static 'css/style.css' %}">   {% endcomment %}
    <link rel='stylesheet' href="{% static 'css/main_style.css'%}">
    <style>
      
  </style>
    <script src='{% static "js/main.js" %}'> </script>
  </head>
  <body>
    <nav class="navbar fixed-top" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand fw-bold" href="">Weather APP</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav5" aria-controls="navbarNav5" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav5">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Features</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Pricing</a>
              </li>
              <li class="nav-item">
                <a class="nav-link">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div class="hero-section">
      </div>
    
      {%if messages %}
        {% for message in messages %}
          <div class="alert alert-{{message.tags}}">
            {{message}}
          </div>
        {%endfor %}
      {%endif%}
      
      <div class='container'> {%block content%} {%endblock%} </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
      // Initialize map with default coordinates (Kathmandu)
      var defaultLat = 27.7172;
      var defaultLon = 85.3240;
      var zoomLevel = 13;
  
      // Create map instance
      var map = L.map('map');
      
      // Set initial view based on weather data or default
      {% if weather_data %}
          var lat = {{ weather_data.coord.lat }};
          var lon = {{ weather_data.coord.lon }};
          map.setView([lat, lon], zoomLevel);
          
          // Add marker for the city
          L.marker([lat, lon]).addTo(map)
              .bindPopup("<b>{{ weather_data.name }}</b><br>{{ weather_data.weather.0.description }}")
              .openPopup();
      {% else %}
          map.setView([defaultLat, defaultLon], zoomLevel);
      {% endif %}
  
      // Add tile layer
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors'
      }).addTo(map);
  
      // Add click handler for map
      map.on('click', function(e) {
          fetch(`/weather?lat=${e.latlng.lat}&lon=${e.latlng.lng}`)
              .then(response =>  response.json())
              .then(data =>  {
                  if(data.name) {
                      // Update form field and submit
                      document.querySelector('#id_city').value = data.name;
                      document.querySelector('form').submit();
                  }
              });
      });
  </script>
  </body>
</html>
