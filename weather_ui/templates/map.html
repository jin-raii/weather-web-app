<!DOCTYPE html>
<html>
<head>
    <title>Fullscreen Globe & Stars</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #scene-container {
            position: fixed;
            width: 100vw;
            height: 100vh;
            z-index: 0;
        }

        .weather-info {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="scene-container">
        <a-scene>
            <!-- Camera setup -->
            <a-camera position="0 0 3" fov="80"></a-camera>
            
            <!-- Rotating Earth -->
            <a-sphere 
                radius="1.5"
                segments-width="64"
                segments-height="64"
                src="https://cdn.jsdelivr.net/gh/aframevr/sample-assets@master/assets/images/space/earth_atmos_4096.jpg"
                rotation="0 90 0">
                <a-animation 
                    attribute="rotation"
                    dur="16000"
                    easing="linear"
                    to="0 450 0"
                    repeat="indefinite"></a-animation>
            </a-sphere>

            <!-- Starry Sky Background -->
            <a-sky 
                src="https://cdn.aframe.io/360-image-gallery-boilerplate/img/sechelt.jpg"
                rotation="0 -90 0">
            </a-sky>
        </a-scene>
    </div>

    <div class="weather-info">
        <h2>Kathmandu (Test)</h2>
        <p>Temperature: 25°C</p>
    </div>

    <script>
        // Error handling for assets
        const earth = document.querySelector('a-sphere');
        const sky = document.querySelector('a-sky');

        earth.addEventListener('error', () => {
            earth.setAttribute('color', '#5599ff');
            console.log('Using fallback Earth color');
        });

        sky.addEventListener('error', () => {
            sky.setAttribute('color', '#000033');
            console.log('Using fallback sky color');
        });
    </script>
</body>
</html>
